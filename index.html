<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eeece3" />
    <meta name="description" content="Palina Skakun’s portfolio: software engineering, AI and machine learning, coursework, and selected projects." />
    <title>Palina Skakun — Palinasonic</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#screen-content">Skip to portfolio</a>
    <header class="site-header">
      <a class="brand" href="#profiles" aria-label="Palina Skakun, choose viewer">palina skakun</a>
      <span class="header-role">Software engineer & creator</span>
      <a class="header-link" href="#about">About me <span aria-hidden="true">↗</span></a>
    </header>

    <main class="stage" id="main">
      <div class="setup">
        <div class="television" id="television">
          <div class="cabinet-top"><span>PALINASONIC</span></div>
          <div class="screen-bezel">
            <div class="screen" id="screen">
              <div class="screen-osd"><span id="channel-label">AV 1 <span class="osd-small">STEREO</span></span><span id="osd-right">DVD / PORTFOLIO</span></div>
              <div class="screen-content" id="screen-content" tabindex="-1"></div>
              <div class="scroll-hint" id="scroll-hint" aria-hidden="true">SCROLL INSIDE THE SCREEN ↓</div>
              <div class="screen-shine" aria-hidden="true"></div>
              <div class="scanlines" aria-hidden="true"></div>
              <div class="channel-static" aria-hidden="true"></div>
            </div>
          </div>
          <div class="tv-controls">
            <div class="tv-wordmark">palinasonic</div>
            <div class="speaker" aria-hidden="true"></div>
            <div class="physical-controls">
              <button class="hardware-button" id="motion-button" aria-pressed="false" title="Pause visual effects"><span aria-hidden="true">Ⅱ</span><small id="motion-label">MOTION</small></button>
              <button class="hardware-button" id="sound-button" aria-pressed="false" title="Enable button sounds"><span id="sound-icon" aria-hidden="true">♪</span><small id="sound-label">SOUND</small></button>
              <button class="hardware-button" id="screensaver-button" title="Watch the bouncing DVD logo"><span aria-hidden="true">▱</span><small>DVD</small></button>
              <button class="power-button" id="power-button" aria-label="Turn television off" aria-pressed="true"><span aria-hidden="true">⏻</span></button>
              <i class="power-led" aria-hidden="true"></i>
            </div>
          </div>
        </div>

        <div class="dvd-deck">
          <span class="deck-brand">DVD <small>VIDEO</small></span>
          <button class="disc-tray" id="eject-button" title="Eject disc and return to viewer selection"><span>PALINA / 01</span><b aria-hidden="true">⏏</b></button>
          <div class="deck-display"><span id="deck-status">HELLO</span><small id="deck-time">00:00:00</small></div>
          <div class="deck-ports" aria-hidden="true"><i></i><i></i><i></i></div>
        </div>
        <div class="tv-feet" aria-hidden="true"><i></i><i></i></div>

        <div class="remote-group">
          <aside class="remote" aria-label="Portfolio remote control">
            <div class="remote-top"><span>ps.</span><button class="remote-power" id="remote-power-button" aria-label="Turn television off" aria-pressed="true" title="Turn television off"><span aria-hidden="true">⏻</span></button></div>
            <div class="remote-pad">
              <button data-remote="previous" class="remote-up" aria-label="Previous channel">▲</button>
              <button data-remote="back" class="remote-left" aria-label="Go back">◀</button>
              <button data-remote="home" class="remote-ok" aria-label="Main menu">OK</button>
              <button data-remote="next" class="remote-right" aria-label="Next channel">▶</button>
              <button data-remote="next" class="remote-down" aria-label="Next channel">▼</button>
            </div>
            <button data-remote="menu" class="remote-menu">MENU</button>
            <div class="remote-colors"><button data-route="about" aria-label="About Palina"></button><button data-route="artifacts" aria-label="Course artifacts"></button><button data-route="bonus" aria-label="Bonus projects"></button><button data-route="contact" aria-label="Contact Palina"></button></div>
          </aside>
        <span class="handwritten remote-note">yes, it works <span aria-hidden="true">↗</span></span>
        </div>

      </div>

    </main>
    <footer class="site-footer"><span>© 2026 PALINA SKAKUN</span><div class="footer-controls"><button class="reading-toggle" data-reading-mode aria-pressed="false">Aa READING VIEW</button><button id="bounce-link">DVD screensaver ↗</button><a href="https://github.com/palinaskakun/aiml500-portfolio-source" target="_blank" rel="noopener noreferrer">SOURCE ↗</a></div></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript><p class="noscript">This DVD menu requires JavaScript. You can still find me on <a href="https://github.com/palinaskakun">GitHub</a> or <a href="mailto:palinaskakun@gmail.com">email me</a>.</p></noscript>
  </body>
</html>
